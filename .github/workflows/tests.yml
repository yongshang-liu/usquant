name: platform-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: usquant
          MYSQL_USER: usquant
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: usquant
      MYSQL_PASSWORD: ci-test-only
      MYSQL_DATABASE: usquant
      USQUANT_TEST_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[mysql]'
      - run: python scripts/build_cpp.py
      - run: python -m unittest discover -s tests -v
      - run: python -m usquant demo --native --backend mysql
