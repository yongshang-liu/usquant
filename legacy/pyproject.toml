[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usquant-mvp"
version = "0.1.0"
description = "Modular US equities research and local paper trading"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL[rsa]==1.1.1"]

[tool.setuptools.packages.find]
include = ["usquant*"]
